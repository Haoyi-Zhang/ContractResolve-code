name: Bounded scientific checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reproduce finite results and retain all comparison gates
        shell: bash
        run: |
          set -euo pipefail
          # 1 GiB address space per process; one runner plus at most four
          # Python children bounds their summed address space to 5 GiB.
          # This is a ceiling, not an aggregate-RSS measurement.
          ulimit -v 1048576
          ulimit -t 360
          timeout --signal=TERM --kill-after=10s 480s \
            python -B reproduce.py --out scientific-output \
            > scientific-output.log 2>&1
      - name: Install the optional native Boolean solver
        run: python -m pip install -r requirements-native.txt
      - name: Check the native proof bridge and provided contract edits
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s python -B -m unittest discover -s tests -p 'test_native_bridge.py' -v
          timeout 120s python -B src/native_contract_probe.py --out native-output --check-retained
      - name: Upload raw outputs even after a failed or timed-out check
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-raw-output
          path: |
            scientific-output.log
            scientific-output/
            native-output/
          if-no-files-found: error
          retention-days: 14
